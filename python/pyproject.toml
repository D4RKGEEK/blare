[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blare"
dynamic = ["version"]
description = "Production failures to Slack, Discord and Teams. One line of setup, no server, no spam."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Blare contributors" }]
keywords = [
    "alerting", "slack", "discord", "teams", "errors", "monitoring",
    "notifications", "logging", "webhook", "observability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
# No runtime dependencies, on purpose. An alerting library should not be able
# to break a deploy by dragging in a version conflict.
dependencies = []

[project.optional-dependencies]
redis = ["redis>=4.2"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "flask>=2.3",
    "fastapi>=0.110",
    "httpx2>=0.28",
    "celery>=5.3",
]

[project.urls]
Homepage = "https://github.com/D4RKGEEK/blare"
Documentation = "https://d4rkgeek.github.io/blare/"
Source = "https://github.com/D4RKGEEK/blare"
Issues = "https://github.com/D4RKGEEK/blare/issues"
Specification = "https://github.com/D4RKGEEK/blare/blob/main/SPEC.md"

[tool.hatch.version]
path = "src/blare/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/blare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["error"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 90
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
